name: cairtech_app
description: "BBCMS — Bible Club Management System (CHF) — frontend Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.1

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # DI
  get_it: ^8.0.2

  # Models / utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.69.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # JWT decoding
  jwt_decoder: ^2.0.1

  # QR code (carte de membre)
  qr_flutter: ^4.1.0

  # Google Fonts (fallback for Geist/Instrument Serif)
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
