services:
  postgres:
    image: postgres:16-alpine
    container_name: bbcms-postgres
    environment:
      POSTGRES_USER: bbcms
      POSTGRES_PASSWORD: bbcms
      POSTGRES_DB: bbcms
    ports:
      - "5432:5432"
    volumes:
      - bbcms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbcms -d bbcms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bbcms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bbcms_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bbcms-mailhog
    ports:
      - "1026:1026"
      - "8026:8026"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbcms-app
    env_file:
      - .env
    environment:
      BBCMS_R2DBC_URL: r2dbc:postgresql://postgres:5432/bbcms
      BBCMS_JDBC_URL: jdbc:postgresql://postgres:5432/bbcms
      BBCMS_MINIO_ENDPOINT: http://minio:9000
      BBCMS_SMTP_HOST: mailhog
      BBCMS_SMTP_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  bbcms_pg_data:
  bbcms_minio_data:
